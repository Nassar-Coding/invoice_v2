  CW-S56|payable:
    reader: false
    engine: true
    disposition: 'Identity breach, not a bar to the line''s value (G3 decision G3-D1, extended in G3 to identity once the identity
      cases existed): the Agreement (p1) states the contract reference and the Subcontractor, but no clause makes a variant
      reference or party name a condition of payment or states any consequence; Cl.42 (p8) lists the content of an application
      without the reference; Cl.48 (p8) times payment of ''a correctly submitted application''; where the contract means a payment
      bar it says so (Cl.43 ''returned unpaid'', Cl.46 ''not payable in any valuation''). The work is evidenced and valued;
      the breach is recorded as a finding. The reader chose the alternative (not payable on this application) and noted the
      engine''s figure as the other reading. Scope: G3-D1 in verification/g3/decision_scopes.json (contract_ref_variant 23 CW
      lines; subcontractor_mismatch 0).'
