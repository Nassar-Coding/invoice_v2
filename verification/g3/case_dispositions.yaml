    disposition: 'Unsigned report on a service outside Schedule 5 (G3 decision G3-D2): Cl.15 (p5) requires both signatures
      and the breach is recorded (report_unsigned); Cl.37 (p8) makes delivery a condition of payment only for services Schedule
      5 lists, so no clause withholds DD-101. Schedule 5 services on an unsigned report are not payable (engine). The reader
